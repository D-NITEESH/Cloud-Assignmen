# Training configuration for the distilled command parser
# Must record all six items as per rubric: seed, lr, batch_size, epochs, max_length, library_versions
seed: 42
learning_rate: 3.0e-4
batch_size: 8
epochs: 3
max_length: 128
model_name: "EleutherAI/pythia-70m"
train_file: "datasets/v1/train.jsonl"
n_train: 1500
output_dir: "models/v1"
loss_file: "training/loss.csv"

# Pinned library versions for reproducibility
library_versions:
  python: "3.11"
  torch: "2.1.2"
  transformers: "4.36.2"
  datasets: "2.16.1"
  accelerate: "0.25.0"
  pyyaml: "6.0.1"
